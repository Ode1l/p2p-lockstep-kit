name: Deploy Signaling Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-signaling-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.SERVER_APP_DIR || '/opt/p2p-lockstep/signaling-server' }}"
            SERVICE_NAME="${{ secrets.SERVER_SERVICE_NAME || 'p2p-signaling' }}"

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run typecheck
            npm run build
            sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl --no-pager --full status "$SERVICE_NAME"
